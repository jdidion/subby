[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "subby"
description = "Subprocesses simplified"
license = "Apache-2.0"
authors = [{ name = "John Didion", email = "github@didion.net" }]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jdidion/subby"
Repository = "https://github.com/jdidion/subby.git"
Changelog = "https://github.com/jdidion/subby/blob/main/CHANGES.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["subby"]

[tool.setuptools_scm]
version_file = "subby/_version.py"
fallback_version = "0.2.0"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately access properties bare inside `pytest.raises(...)` to assert
# that accessing them raises; that is not a useless expression here.
"tests/*" = ["B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["subby"]
omit = ["subby/_version.py"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "pragma: no-cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "LOG.*",
]
